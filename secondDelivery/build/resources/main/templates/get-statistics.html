<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
    <head>
        <meta charset="UTF-8">
        <title>Peticion 2 - Obtener Estadisticas</title>
    </head>
    <body>
        <h1>Conteo total, Suma, Promedio, Minimo y Maximo</h1>
        <ul th:text="${conteo}"></ul>
        <ul th:text="${suma}"></ul>
        <ul th:text="${promedio}"></ul>
        <ul th:text="${minimo}"></ul>
        <ul th:text="${maximo}"></ul>
    </body>
</html>
